<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 Minute to Draw!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home" class="screen active">
      <div class="card hero">
        <div class="pencil">✏️</div>
        <h1>1 Minute to Draw!</h1>
        <p>You have exactly one minute. Draw anything!</p>
        <button id="startBtn" class="primary">START</button>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="topbar">
        <button id="backBtn" class="small">← Home</button>
        <div id="timer">01:00</div>
        <button id="clearBtn" class="small">Clear</button>
      </header>

      <div class="toolbar">
        <label>Color <input id="color" type="color" value="#111111"></label>
        <label>Brush <input id="size" type="range" min="1" max="40" value="7"></label>
        <span id="sizeValue">7 px</span>
        <button id="eraserBtn" class="small">Eraser</button>
      </div>

      <div class="canvasWrap">
        <canvas id="canvas"></canvas>
      </div>
      <p class="hint">Mouse, finger, or stylus • Draw fast!</p>
    </section>

    <section id="done" class="screen">
      <div class="card">
        <div class="big">⏰</div>
        <h2>TIME'S UP!</h2>
        <p>Your drawing is finished.</p>
        <img id="preview" alt="Your finished drawing">
        <div id="status">Sending drawing...</div>
        <button id="againBtn" class="primary">DRAW AGAIN</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
