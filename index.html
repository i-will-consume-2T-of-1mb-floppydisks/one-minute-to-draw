<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>1 Minute to Draw!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="home" class="screen active">
      <div class="terminal-window">
        <div class="terminal-bar">
          <span class="dot">●</span><span class="dot">●</span><span class="dot">●</span>
          <span class="terminal-title">1-minute-to-draw.exe</span>
        </div>
        <div class="terminal-body">
          <img class="smiley" src="smiley.jpeg" alt="Hand-drawn smiley">
          <div class="terminalLine">1-MINUTE-TO-DRAW TERMINAL v1.0</div>
          <h1>&gt; 1 MINUTE TO DRAW!</h1>
          <div class="terminalText">
            <div>&gt; TIME LIMIT: 60 SECONDS</div>
            <div>&gt; DRAW ANYTHING.</div>
            <div>&gt; READY.</div>
          </div>

          <div class="theme-section">
            <div>&gt; SELECT THEME:</div>
            <div class="theme-controls">
              <button id="darkModeBtn" class="terminal-button">[ DARK MODE ]</button>
              <button id="lightModeBtn" class="terminal-button">[ LIGHT MODE ]</button>
            </div>
          </div>

          <label class="name-label" for="nameInput">&gt; ENTER YOUR NAME:</label>
          <input id="nameInput" class="name-input" type="text" maxlength="20" placeholder="Your name..." autocomplete="off" spellcheck="false">
          <div id="nameError" class="name-error" aria-live="polite"></div>

          <button id="startBtn" class="primary">[ START DRAWING ]</button>
        </div>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="topbar">
        <button id="backBtn" class="small">&lt; Home</button>
        <div id="timer">01:00</div>
        <div class="top-actions">
          <button id="clearBtn" class="small">Clear</button>
          <button id="musicBtn" class="small">♫ Music: ON</button>
        </div>
      </header>

      <div class="toolbar">
        <label>Color <input id="color" type="color" value="#111111"></label>
        <label>Brush <input id="size" type="range" min="1" max="40" value="7"></label>
        <span id="sizeValue">7 px</span>
        <button id="eraserBtn" class="small">Eraser</button>
      </div>

      <div class="canvasWrap"><canvas id="canvas"></canvas></div>
      <p class="hint">&gt; mouse / finger / stylus detected — draw fast!_</p>
      <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>
    </section>

    <section id="done" class="screen">
      <div class="terminal-window done-window">
        <div class="terminal-bar">
          <span class="dot">●</span><span class="dot">●</span><span class="dot">●</span>
          <span class="terminal-title">submission.complete</span>
        </div>
        <div class="terminal-body">
          <div class="big">&gt;_</div>
          <h2>TIME'S UP!</h2>
          <p>Your drawing is finished.</p>
          <p id="artistLine" class="artist-line"></p>
          <img id="preview" alt="Your finished drawing">
          <div id="status" aria-live="polite">Sending drawing...</div>
          <button id="againBtn" class="primary">[ DRAW AGAIN ]</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
